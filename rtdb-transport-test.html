<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTDB Transport Test</title><style>body{font-family:system-ui;background:#071827;color:#eef7ff;padding:24px}main{max-width:680px;margin:auto}.card{background:#102536;border-radius:16px;padding:18px;margin-top:16px}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700;background:#32d296}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main><h1>RTDB Direct Transport Test</h1><p>This checks whether this mobile network can reach the Realtime Database HTTPS endpoint directly.</p><button id="run">RUN TEST</button><div class="card"><pre id="out">Ready.</pre></div></main><script type="module">import{firebaseConfig}from'./firebase-config.js';const out=document.getElementById('out');async function run(){out.textContent='Testing direct HTTPS access...';const base=String(firebaseConfig.databaseURL||'').replace(/\/+$/,'');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(base+'/.json?shallow=true',{signal:controller.signal,cache:'no-store'});const text=await r.text();out.textContent='DIRECT RTDB REACHABLE\nHTTP '+r.status+'\n'+text.slice(0,500)+'\n\nAny HTTP response, including Permission denied, means the RTDB host is reachable.';}catch(e){out.textContent='DIRECT RTDB FAILED\n'+(e?.name||'Error')+': '+(e?.message||e);}finally{clearTimeout(timer);}}document.getElementById('run').onclick=run;run();</script></body></html>
