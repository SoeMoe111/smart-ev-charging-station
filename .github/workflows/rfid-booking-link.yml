name: Hardware-first RFID enrollment UI

on:
  push:
    paths:
      - ".github/workflows/rfid-booking-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch website
        run: python tools/hardware_rfid_patch.py

      - name: Commit website update
        run: |
          if git diff --quiet -- index.html app.js; then
            echo "No website changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js
          git commit -m "Switch RFID UI to hardware-first enrollment flow"
          git push
