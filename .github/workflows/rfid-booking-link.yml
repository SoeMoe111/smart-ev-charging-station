name: Link RFID access to active bookings

on:
  push:
    paths:
      - ".github/workflows/rfid-booking-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update RFID scan logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app.js")
          text = path.read_text(encoding="utf-8")

          start = text.index("// ---------- RFID SCAN ----------")
          end = text.index("const clearUsers =", start)

          replacement = r'''// ---------- RFID + ACTIVE BOOKING ACCESS ----------

function normalizeIdentityText(value) {
  return String(value ?? "")
    .trim()
    .toUpperCase()
    .replace(/[^0-9A-Z]/g, "");
}

function bookingWindow(booking) {
  const start = new Date(
    `${booking.date}T${booking.time}`
  ).getTime();

  const durationMinutes = Number(booking.duration) || 0;
  const end = start + durationMinutes * 60000;

  return { start, end };
}

function bookingBelongsToUser(booking, user, scannedUid) {
  const bookingUid = normalizeUid(booking.uid);

  // Strongest match: the reservation itself contains this RFID UID.
  if (bookingUid) {
    return bookingUid === scannedUid;
  }

  // Backward-compatible fallback for bookings made before RFID UID was entered.
  const bookingPlate = normalizeIdentityText(booking.plate);
  const userPlate = normalizeIdentityText(user.plate);

  if (bookingPlate && userPlate && bookingPlate === userPlate) {
    return true;
  }

  const bookingDriver = normalizeIdentityText(booking.driver);
  const userName = normalizeIdentityText(user.name);

  return Boolean(
    bookingDriver &&
    userName &&
    bookingDriver === userName
  );
}

function findActiveBooking(user, scannedUid, now = Date.now()) {
  return bookings.find(booking => {
    if (booking.status === "cancelled") {
      return false;
    }

    if (!bookingBelongsToUser(booking, user, scannedUid)) {
      return false;
    }

    const { start, end } = bookingWindow(booking);

    if (!Number.isFinite(start) || !Number.isFinite(end)) {
      return false;
    }

    return now >= start && now < end;
  });
}

function bookingTimeRange(booking) {
  const { start, end } = bookingWindow(booking);

  const formatTime = timestamp =>
    new Date(timestamp).toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  return `${formatTime(start)}–${formatTime(end)}`;
}

const scanBtn =
  document.getElementById("scanBtn");


if (scanBtn) {

  scanBtn.addEventListener(
    "click",
    async () => {

      if (!adminMode) {
        return;
      }

      const uid = normalizeUid(
        document.getElementById("scanUid").value
      );

      const user =
        rfidUsers.find(
          item => item.uid === uid
        );

      if (!uid || !user) {

        scanResult.className =
          "scan-result denied";

        scanResult.innerHTML =
          "ACCESS DENIED<br>RFID NOT REGISTERED";

        if (firebaseMode) {
          recordAccessEvent({
            uid,
            granted: false,
            source: "website-rfid-booking"
          }).catch(error =>
            console.error("Access event log failed", error)
          );
        }

        return;
      }

      const activeBooking =
        findActiveBooking(user, uid);

      if (!activeBooking) {

        scanResult.className =
          "scan-result denied";

        scanResult.innerHTML =
          `ACCESS DENIED<br>${escapeHtml(user.name)} · NO ACTIVE BOOKING`;

        if (firebaseMode) {
          recordAccessEvent({
            uid,
            granted: false,
            userName: user.name,
            plate: user.plate,
            source: "website-rfid-booking"
          }).catch(error =>
            console.error("Access event log failed", error)
          );
        }

        return;
      }

      scanResult.className =
        "scan-result granted";

      scanResult.innerHTML =
        `ACCESS GRANTED<br>${escapeHtml(user.name)} · ${escapeHtml(user.plate)}<br>${escapeHtml(activeBooking.slot)} · ${escapeHtml(bookingTimeRange(activeBooking))}`;

      if (firebaseMode) {
        recordAccessEvent({
          uid,
          granted: true,
          userName: user.name,
          plate: user.plate,
          source: "website-rfid-booking"
        }).catch(error =>
          console.error("Access event log failed", error)
        );
      }
    }
  );
}


'''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Require active booking for RFID access"
          git push
