name: Link RFID access to active bookings

on:
  push:
    paths:
      - ".github/workflows/rfid-booking-link.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch app.js
        shell: bash
        run: echo '' | base64 -d | python

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- app.js; then
            echo "No app.js changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Require active booking for RFID access"
          git push
