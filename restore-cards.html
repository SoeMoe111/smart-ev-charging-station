<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restore RFID Cards</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#081728;color:#eef6ff;margin:0;padding:28px}.card{max-width:560px;margin:40px auto;background:#10283c;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0005}h1{margin-top:0}p{line-height:1.5;color:#bdd0df}.btn{width:100%;padding:16px;border:0;border-radius:14px;background:#2fd3a2;color:#062116;font-weight:800;font-size:18px}.btn:disabled{opacity:.55}.status{margin-top:18px;padding:14px;border-radius:12px;background:#0a1e2e;white-space:pre-line}.ok{color:#6ff0c4}.err{color:#ff8797}
  </style>
</head>
<body>
  <div class="card">
    <h1>Restore 3 Project RFID Cards</h1>
    <p>ESP32 power is not required. Sign in as ADMIN on the main website first, then use this restore button.</p>
    <button id="restoreBtn" class="btn">RESTORE 3 PROJECT CARDS</button>
    <div id="status" class="status">Ready.</div>
  </div>
  <script type="module">
    const { firebaseConfig } = await import("./firebase-config.js?v=restore-1534");
    const V = "12.18.0";
    const C = `https://www.gstatic.com/firebasejs/${V}`;
    const [{ initializeApp }, authSdk, dbSdk] = await Promise.all([
      import(`${C}/firebase-app.js`),
      import(`${C}/firebase-auth.js`),
      import(`${C}/firebase-database.js`)
    ]);
    const ADMIN_UID = "fM6p0sQzQbaqKAmuQFGA6mNolJU2";
    const cards = [
      ["7A-BB-E4-06", "7A BB E4 06", "Soe Moe"],
      ["BD-B0-50-07", "BD B0 50 07", "Myint Zu Khin"],
      ["8D-C9-0D-07", "8D C9 0D 07", "Kyaw Zayar Min"]
    ];
    const app = initializeApp(firebaseConfig);
    const auth = authSdk.getAuth(app);
    const db = dbSdk.getDatabase(app);
    await authSdk.setPersistence(auth, authSdk.browserLocalPersistence);
    const status = document.getElementById("status");
    const button = document.getElementById("restoreBtn");
    const getUser = () => new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>{stop();reject(new Error("Authentication timed out."));},8000);
      const stop=authSdk.onAuthStateChanged(auth,user=>{if(!user)return;clearTimeout(timer);stop();resolve(user);},reject);
    });
    button.addEventListener("click", async()=>{
      button.disabled=true; status.className="status"; status.textContent="Checking admin session...";
      try{
        const user=auth.currentUser || await getUser();
        if(!user || user.uid!==ADMIN_UID) throw new Error("ADMIN login is required on the main website first.");
        status.textContent="Restoring cards to Firebase...";
        for(const [key,uid,name] of cards){
          await dbSdk.set(dbSdk.ref(db,`rfidUsers/${key}`),{name,uid,active:true,updatedAt:dbSdk.serverTimestamp(),updatedBy:user.uid});
        }
        status.className="status ok"; status.textContent="SUCCESS\n3 project cards restored.\nSoe Moe\nMyint Zu Khin\nKyaw Zayar Min"; button.textContent="RESTORED";
      }catch(error){
        console.error(error); status.className="status err"; status.textContent=`FAILED\n${error.message}`; button.disabled=false; button.textContent="TRY AGAIN";
      }
    });
  </script>
</body>
</html>
